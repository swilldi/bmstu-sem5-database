services:
  db:
    image: postgres:17
    container_name: study-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: study
      PGUSER: postgres
      PGDATABASE: study
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./:/workspace:ro
      - ./initdb:/docker-entrypoint-initdb.d:ro

volumes:
  pgdata: